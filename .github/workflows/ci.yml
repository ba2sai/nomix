# CI de Nomix (docs/nomix/05 §6). Ejecuta los mismos comandos que el entorno local
# (make env/setup/lint/test) sobre Docker Compose, para que el CI y el desarrollo no
# diverjan: PostgreSQL 16 real con los roles de docker/postgres/init (RLS), PHP 8.5
# con PCOV y Node 24, idénticos a los de cada desarrollador.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generar .env con secretos efímeros
        run: make env

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Equivale al "compose build app" de make up, con caché de capas entre ejecuciones.
      - name: Construir la imagen PHP
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/php/Dockerfile
          tags: nomix-php:local
          load: true
          cache-from: type=gha,scope=nomix-php
          cache-to: type=gha,scope=nomix-php,mode=max

      - name: Levantar PostgreSQL, Redis y Mailpit
        run: docker compose up -d --wait postgres redis mailpit

      - name: Instalar dependencias, migrar e iniciar servicios
        run: make setup

      - name: Lint (Compose, Composer, Pint, PHPStan, ESLint, Prettier, TypeScript)
        run: make lint

      - name: Pruebas (Pest, mutación, RLS, Horizon, Vitest, integración y build)
        run: make test

      - name: Registros de los servicios
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Apagar el entorno
        if: always()
        run: docker compose down --volumes --remove-orphans
