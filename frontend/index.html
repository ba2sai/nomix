<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#133a36" />
    <title>Nomix · Nómina inteligente</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar un destello claro en modo oscuro.
      // Debe coincidir con getInitialTheme() en src/app/theme/theme-context.ts.
      try {
        const stored = localStorage.getItem('nomix-theme');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        // Sin almacenamiento: ThemeProvider resuelve el tema al montar.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
