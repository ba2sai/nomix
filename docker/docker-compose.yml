# Nomix — stack de desarrollo local (ADR-012)
# Producción usa el mismo compose con overrides + réplica + pgBackRest.
name: nomix

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nomix}
      POSTGRES_USER: ${POSTGRES_USER:-nomix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nomix_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nomix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Los servicios de app se activan cuando existan sus Dockerfiles.
  # En desarrollo temprano se corren con `pnpm dev` en el host contra
  # postgres/redis de arriba. Descomentar al contenerizar.
